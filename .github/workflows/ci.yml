name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.12
      - name: radon（有输出即失败）
        run: |
          out="$(uv run radon cc -n C src/)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: import-linter
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest
